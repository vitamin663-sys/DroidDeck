name: Verify framegen post-upscale
on:
  push:
    branches: [validation/framegen-post-upscale]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a80e8be4e52254348174f14ced1be4468955e59b
          persist-credentials: false
      - name: Install host Vulkan headers
        run: bash tools/ci/install-ubuntu-packages.sh python3-yaml gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user libvulkan-dev mesa-vulkan-drivers
      - name: Compile and run effects routing and resource lifetime harnesses
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_effects*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_vk_terminal_callers.py' -v

      - name: Run complete Python and native regression suite
        run: bash tools/ci/run-python-tests.sh

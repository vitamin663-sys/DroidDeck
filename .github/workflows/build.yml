name: Verify 0.6.7 stick dead zone
run-name: Verify 0.6.7 source e571a574 and existing features
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-stick-dead-zone-067
  cancel-in-progress: false
jobs:
  jvm-regression:
    name: Compile app and run all JVM regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e571a57448ccf0106c8ce5edeb7399fe91af297b
          persist-credentials: false
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = e571a57448ccf0106c8ce5edeb7399fe91af297b
          test "$(git rev-parse 'HEAD^{tree}')" = 470af380fa6bcb0c40e1eb8f136a4ba0e985c306
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run documented local-equivalent JVM tests without native APK preparation
        run: |
          set -o pipefail
          env GITHUB_ACTIONS=false bash ./gradlew -PskipRust=true :app:testDebugUnitTest --console=plain --no-daemon 2>&1 | tee jvm-regression.log
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-067-jvm-regression
          path: |
            jvm-regression.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

name: Verify 0.6.9 stick dead zone
run-name: Verify 0.6.9 source dbec2945 and existing features
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-stick-dead-zone-067
  cancel-in-progress: false
jobs:
  jvm-regression:
    name: Compile app and run all JVM regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbec294583cf74cdb3000ff5a371335082cc148a
          persist-credentials: false
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = dbec294583cf74cdb3000ff5a371335082cc148a
          test "$(git rev-parse 'HEAD^{tree}')" = f6daaa13516f7e49da6ee5b7b3e6a72eb2067666
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run documented local-equivalent JVM tests without native APK preparation
        run: |
          set -o pipefail
          env GITHUB_ACTIONS=false bash ./gradlew -PskipRust=true :app:testDebugUnitTest --console=plain --no-daemon 2>&1 | tee jvm-regression.log
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-067-jvm-regression
          path: |
            jvm-regression.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

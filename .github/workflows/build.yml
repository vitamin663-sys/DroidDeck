name: Verify 0.6.9 stick dead zone
run-name: Verify 0.6.9 source 97eff13e and existing features
on:
  push:
    branches: [validation/stick-dead-zone-067]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-stick-dead-zone-067
  cancel-in-progress: false
jobs:
  jvm-regression:
    name: Compile app and run all JVM regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 97eff13e439dc99b6532014f64bec6ac80b8ab0b
          persist-credentials: false
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = 97eff13e439dc99b6532014f64bec6ac80b8ab0b
          test "$(git rev-parse 'HEAD^{tree}')" = 88a75705319a5c5427deee6c3c9b02e366796f78
      - name: Prepare pinned MaliBridge for 0.6.9 unit-test prerequisites
        run: git submodule update --init external/MaliBridge
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run documented local-equivalent JVM tests without native APK preparation
        run: |
          set -o pipefail
          env GITHUB_ACTIONS=false bash ./gradlew -PskipRust=true :app:testDebugUnitTest --console=plain --no-daemon 2>&1 | tee jvm-regression.log
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-067-jvm-regression
          path: |
            jvm-regression.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
